# Build the macOS FiveAtlas app on GitHub's Mac runners.
#
# This exists so you can ship a Mac build without owning a Mac: PyInstaller
# cannot cross-compile, so the app has to be built on the OS *and* the CPU
# architecture it will run on:
#   macos-14 -> Apple Silicon (arm64)   -- what every Mac sold since 2021 is
# (Intel is not built; see the matrix comment below.)
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
# The .dmg and .zip come out as downloadable build artifacts; a tag push also
# attaches them to a GitHub Release, which is the link you send colleagues.
name: Build FiveAtlas (macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into the app and filenames"
        required: false
        default: "0.0.0-dev"
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to attach the .dmg to a Release on a tag push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # Intel (macos-13) is deliberately NOT built.
          #
          # It never once started across seven runs -- that runner pool is
          # exhausted -- and because a queued job holds a slot against the
          # account's macOS concurrency limit, the seven zombies it left behind
          # went on to starve the arm64 job, which then failed with "not acquired
          # by Runner of type hosted". So the Intel job was not merely useless,
          # it was the thing breaking the build that mattered.
          #
          # Every Mac sold since 2021 is Apple Silicon. If an Intel build is ever
          # genuinely needed, add `- runner: macos-13 / arch: x86_64` back, but
          # expect to babysit it -- and cancel it if it queues, rather than
          # leaving it to clog the pool.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      # Every action is pinned to a commit SHA, not a floating tag: a tag can be
      # moved to different code after the fact, a SHA cannot. (Versions noted
      # beside each are what the SHA resolves to.)
      #
      # persist-credentials: false -- the checkout token must not sit in
      # .git/config while `npm ci` runs packages' install scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 3.11, not the 3.9 the Windows venv uses: 3.9 is past end-of-life and
      # several of these packages no longer publish macOS arm64 wheels for it,
      # which would mean compiling GEOS and the imagecodecs stack from source.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # requirements.txt is the pinned set (backend/requirements.txt is the loose
      # one, and it lists rasterio, which nothing imports -- it would drag in
      # GDAL for nothing).
      # numpy FIRST, as the explicit macosx_11_0_arm64 wheel. PyPI has both an
      # 11.0 (OpenBLAS) and a 14.0 (Accelerate) wheel for it, and pip on this
      # macos-14 runner prefers the 14.0 one -- which made v0.5.1 the only
      # build whose numpy needed Sonoma while its plist promised Big Sur, so
      # on macOS 11-13 it launched and died importing numpy. Installing the
      # 11.0 wheel by name means `-r requirements.txt` sees numpy satisfied and
      # leaves it alone; check_min_os.py below proves the whole bundle agrees.
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          NUMPY_PIN="$(grep -E '^numpy==' requirements.txt)"
          pip download "$NUMPY_PIN" --only-binary=:all: \
              --platform macosx_11_0_arm64 --python-version 3.11 \
              --implementation cp --abi cp311 -d "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/numpy-*.whl
          pip install -r requirements.txt
          pip install "pyinstaller==6.21.0"
          pip freeze > "$RUNNER_TEMP/requirements-built.txt"
          echo "---- resolved set ----"; cat "$RUNNER_TEMP/requirements-built.txt"

      - name: Resolve version
        id: ver
        env:
          VER_IN: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${VER_IN:-0.0.0-dev}"
          fi
          # It ends up in a filename, Info.plist and a generated Python module.
          if ! printf '%s' "$v" | grep -Eq '^[0-9][0-9A-Za-z.+-]*$'; then
            echo "::error::version '$v' is not a plain version string"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VER: ${{ steps.ver.outputs.value }}
        run: |
          chmod +x build_release_mac.sh
          ./build_release_mac.sh --version "$VER"

      # The plist must not promise an older macOS than the binaries inside can
      # run on, and the version baked in must be the one on the tag.
      - name: Check bundle minimum macOS and version
        env:
          VER: ${{ steps.ver.outputs.value }}
        run: |
          APP="$HOME/Library/Caches/FiveAtlas_build/release/FiveAtlas.app"
          python3 tests/check_min_os.py "$APP"
          got="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "plist version: $got  (expected $VER)"
          [ "$got" = "$VER" ] || { echo "::error::Info.plist says $got, tag says $VER"; exit 1; }

      # Proves the bundle actually starts and serves the UI on this runner --
      # a missing hidden import or codec dylib fails here rather than on a
      # colleague's laptop. ATLAS_NO_BROWSER keeps it from opening Safari.
      #
      # continue-on-error: the .dmg is already built and signed by this point, so
      # a runtime problem should still hand you a downloadable artifact plus the
      # diagnostics to fix it -- not throw the build away. The job is still
      # marked failed by the "Fail if smoke test failed" step at the end.
      - name: Smoke-test the built app
        id: smoke
        continue-on-error: true
        env:
          ATLAS_NO_BROWSER: "1"
          ATLAS_PORT: "8051"
        run: |
          set +e
          APP="$HOME/Library/Caches/FiveAtlas_build/release/FiveAtlas.app"
          OUT="$RUNNER_TEMP/app-stdout.txt"

          # Workflow logs need admin rights to download via the API, but check-run
          # ANNOTATIONS are public. So the diagnostics go out as ::error:: lines,
          # which means they can be read straight from the API when this fails.
          # Newlines have to be percent-encoded to survive a workflow command.
          annotate() {
            local title="$1" body
            body=$(head -c 4000 "$2" 2>/dev/null | python3 -c \
              "import sys;print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            [ -n "$body" ] && echo "::error title=${title}::${body}"
          }

          "$APP/Contents/MacOS/FiveAtlas" >"$OUT" 2>&1 &
          PID=$!
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:8051/api/health" >/dev/null 2>&1; then
              echo "health OK after ${i}s"
              ok=1
              # The UI root must be the built SPA, and its script must be served.
              idx=$(curl -fsS "http://127.0.0.1:8051/" || true)
              echo "$idx" | grep -q 'id="root"' || { echo "::error title=ui::/ is not the SPA index"; ok=0; }
              js=$(echo "$idx" | grep -o '/assets/index-[^"]*\.js' | head -1)
              if [ -n "$js" ]; then
                curl -fsS -o /dev/null "http://127.0.0.1:8051$js" || { echo "::error title=ui::$js not served"; ok=0; }
              else
                echo "::error title=ui::no /assets/index-*.js in index.html"; ok=0
              fi
              # The native stack, exercised for real: JPEG2000 decode, blosc,
              # GEOS, YAML, Pillow, Tk. /api/health cannot see a missing dylib.
              st=$(curl -fsS "http://127.0.0.1:8051/api/selftest" || echo '{"ok":false}')
              echo "$st" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=1)); sys.exit(0 if d.get("ok") else 1)' \
                || { echo "::error title=selftest::$(echo "$st" | head -c 1500)"; ok=0; }
              kill $PID 2>/dev/null
              [ "$ok" = 1 ] && exit 0
              echo "::error title=smoke::the app serves, but a check above failed"
              exit 1
            fi
            if ! kill -0 $PID 2>/dev/null; then
              wait $PID; rc=$?
              echo "::error title=exit::app exited after ${i}s with code $rc"
              [ $rc -eq 137 ] && echo "::error title=sigkill::137 = SIGKILL, the kernel is rejecting the bundle signature"
              break
            fi
            sleep 1
          done

          # Still alive but not serving is the interesting case: dump where it got to.
          kill -0 $PID 2>/dev/null && echo "::error title=state::process $PID still alive but never answered /api/health"
          sample $PID 2 -f "$RUNNER_TEMP/sample.txt" >/dev/null 2>&1
          lsof -nP -iTCP -sTCP:LISTEN >"$RUNNER_TEMP/listening.txt" 2>/dev/null
          cp "$HOME/Library/Application Support/FiveAtlas/FiveAtlas.log" "$RUNNER_TEMP/fiveatlas.log" 2>/dev/null

          echo "===== app stdout/stderr ====="; cat "$OUT" 2>/dev/null
          echo "===== FiveAtlas.log =====";     cat "$RUNNER_TEMP/fiveatlas.log" 2>/dev/null
          echo "===== listening =====";         cat "$RUNNER_TEMP/listening.txt" 2>/dev/null
          echo "===== stack sample =====";      head -60 "$RUNNER_TEMP/sample.txt" 2>/dev/null

          annotate "app-stdout" "$OUT"
          annotate "fiveatlas-log" "$RUNNER_TEMP/fiveatlas.log"
          annotate "listening" "$RUNNER_TEMP/listening.txt"
          annotate "stack-sample" "$RUNNER_TEMP/sample.txt"

          kill -9 $PID 2>/dev/null
          exit 1

      # v0.1.5 shipped an app that opened browser tabs faster than the user could
      # force-quit it. The trigger was never reproduced, so launcher.py carries a
      # circuit breaker; this asserts the bound still holds on the real bundle.
      - name: Tab-storm regression check
        id: storm
        continue-on-error: true
        run: |
          chmod +x tests/tab_storm_check.sh
          ./tests/tab_storm_check.sh \
            "$HOME/Library/Caches/FiveAtlas_build/release/FiveAtlas.app/Contents/MacOS/FiveAtlas"

      # if: always() -- the whole point is to get the .dmg and the logs out even
      # when the app misbehaves.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FiveAtlas-macos-${{ matrix.arch }}
          path: |
            ~/Library/Caches/FiveAtlas_build/release/*.dmg
            ~/Library/Caches/FiveAtlas_build/release/*.zip
            ~/Library/Caches/FiveAtlas_build/release/README.txt
            ~/Library/Caches/FiveAtlas_build/release/SHA256SUMS
            ${{ runner.temp }}/requirements-built.txt
            ${{ runner.temp }}/app-stdout.txt
            ${{ runner.temp }}/fiveatlas.log
            ${{ runner.temp }}/listening.txt
            ${{ runner.temp }}/sample.txt
          if-no-files-found: warn

      # Only publish a Release from a build that actually ran. A .dmg that fails
      # its own smoke test should not become the download people are handed.
      # Published with the gh CLI that is already on the runner, not a
      # third-party action holding the write token. The release body is the
      # same README that is inside the .dmg, so the download page itself says
      # how to get past Gatekeeper and what Macs it runs on.
      - name: Attach to release
        if: github.ref_type == 'tag' && steps.smoke.outcome == 'success' && steps.storm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$HOME/Library/Caches/FiveAtlas_build/release"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "FiveAtlas $GITHUB_REF_NAME" \
              --notes-file "$R/README.txt"
          fi
          gh release upload "$GITHUB_REF_NAME" "$R"/*.dmg "$R"/*.zip "$R/SHA256SUMS" --clobber

      - name: Fail if any check failed
        if: steps.smoke.outcome != 'success' || steps.storm.outcome != 'success'
        run: |
          echo "smoke: ${{ steps.smoke.outcome }}   tab-storm: ${{ steps.storm.outcome }}"
          echo "The app was built and uploaded as an artifact, but a check failed."
          echo "See the step above for the reason."
          exit 1
